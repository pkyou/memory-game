<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>庞以恒的玩具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, "SF Pro Rounded", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 顶部状态栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.25);
            padding: 8px 15px;
            border-radius: 20px;
        }

        /* 游戏面板 */
        .grid {
            display: grid;
            gap: 10px;
            padding: 15px 5px;
            flex: 1;
            align-content: center;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }

        .grid.easy {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid.medium {
            grid-template-columns: repeat(4, 1fr);
        }

        .grid.hard {
            grid-template-columns: repeat(4, 1fr);
        }

        /* 卡片 */
        .card {
            aspect-ratio: 1;
            perspective: 600px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* 卡片背面 */
        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 36px;
        }

        .card-back::after {
            content: "❓";
        }

        /* 卡片正面 */
        .card-front {
            background: white;
            transform: rotateY(180deg);
            font-size: 50px;
        }

        /* 匹配成功动画 */
        .card.matched .card-inner {
            animation: matchPop 0.6s ease;
        }

        @keyframes matchPop {
            0% { transform: rotateY(180deg) scale(1); }
            30% { transform: rotateY(180deg) scale(1.15); }
            60% { transform: rotateY(180deg) scale(0.95); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .card.matched .card-front {
            box-shadow: 0 0 25px rgba(46, 125, 50, 0.6);
            background: #e8f5e9;
        }

        /* 匹配失败动画 */
        .card.mismatch {
            animation: mismatchShake 0.5s ease;
        }

        @keyframes mismatchShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 完成弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-emoji {
            font-size: 80px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .modal-title {
            font-size: 28px;
            font-weight: 800;
            color: #333;
            margin: 15px 0 10px;
        }

        .modal-stats {
            font-size: 18px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-primary {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 25px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        /* 难度选择 */
        .difficulty-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .difficulty-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .difficulty-subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .difficulty-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .diff-btn {
            background: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .diff-btn:active {
            transform: scale(0.95);
        }

        .diff-btn .label {
            text-align: left;
        }

        .diff-btn .label .name {
            font-size: 22px;
            color: #333;
        }

        .diff-btn .label .desc {
            font-size: 14px;
            color: #888;
            font-weight: 400;
        }

        .diff-btn .emoji {
            font-size: 32px;
        }

        /* 星星评分 */
        .stars {
            font-size: 40px;
            margin: 15px 0;
        }

        /* iPad适配 */
        @media (min-width: 768px) {
            .grid { max-width: 450px; }
            .card-front { font-size: 60px; }
            .card-back::after { font-size: 48px; }
        }

        /* 横屏 */
        @media (max-height: 500px) and (orientation: landscape) {
            .header { font-size: 14px; }
            .stat { padding: 5px 10px; }
            .grid { gap: 8px; padding: 5px; }
        }
    </style>
</head>
<body>

<!-- 难度选择 -->
<div class="difficulty-screen" id="difficultyScreen">
    <img src="./avatar.png" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,0.8);box-shadow:0 8px 30px rgba(0,0,0,0.2);" alt="庞以恒">
    <div class="difficulty-title">庞以恒的玩具</div>
    <div class="difficulty-subtitle">翻一翻，找相同！</div>
    <div class="difficulty-buttons">
        <button class="diff-btn" onclick="startGame('easy')">
            <span class="label">
                <span class="name">简单</span><br>
                <span class="desc">6张卡片 · 3对</span>
            </span>
            <span class="emoji">🌟</span>
        </button>
        <button class="diff-btn" onclick="startGame('medium')">
            <span class="label">
                <span class="name">中等</span><br>
                <span class="desc">12张卡片 · 6对</span>
            </span>
            <span class="emoji">⭐</span>
        </button>
        <button class="diff-btn" onclick="startGame('hard')">
            <span class="label">
                <span class="name">困难</span><br>
                <span class="desc">16张卡片 · 8对</span>
            </span>
            <span class="emoji">🏆</span>
        </button>
    </div>
</div>

<!-- 游戏主界面 -->
<div id="gameScreen" style="display: none; flex-direction: column; min-height: 100vh; min-height: 100dvh;">
    <div class="header">
        <div class="stat">⭐ <span id="score">0</span></div>
        <div class="stat">🎴 <span id="pairs">0</span>/<span id="totalPairs">0</span></div>
        <button class="stat" onclick="backToMenu()" style="cursor: pointer; font-size: 16px;">🏠 菜单</button>
    </div>

    <div class="grid" id="grid"></div>
</div>

<!-- 完成弹窗 -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <div class="modal-emoji">🎉</div>
        <div class="modal-title">全部找到！</div>
        <div class="stars" id="stars"></div>
        <div class="modal-stats" id="modalStats"></div>
        <button class="btn-primary" onclick="restartGame()">🔄 再玩一次</button>
    </div>
</div>

<script>
// 卡片池
const EMOJI_POOL = [
    '🐱', '🐶', '🐟', '🐦', '🦆', '🐷', '🐄', '🦊',
    '🐸', '🐵', '🐰', '🐻', '🍎', '🍌', '🍇', '🍉',
    '🌈', '⭐', '☀️', '🌙', '🎈', '🎁', '🎨', '🎵',
    '🚗', '✈️', '🚀', '🏀', '⚽', '🎯', '🌸', '🌻'
];

let gameState = {
    difficulty: 'easy',
    cards: [],
    flippedCards: [],
    matchedPairs: 0,
    totalPairs: 0,
    attempts: 0,
    locked: false
};

const DIFFICULTY_CONFIG = {
    easy: { pairs: 3, cols: 3 },
    medium: { pairs: 6, cols: 4 },
    hard: { pairs: 8, cols: 4 }
};

function startGame(difficulty) {
    gameState.difficulty = difficulty;
    gameState.flippedCards = [];
    gameState.matchedPairs = 0;
    gameState.attempts = 0;
    gameState.locked = false;

    const config = DIFFICULTY_CONFIG[difficulty];
    gameState.totalPairs = config.pairs;

    // 随机选择emoji
    const shuffledPool = shuffle([...EMOJI_POOL]);
    const selectedEmojis = shuffledPool.slice(0, config.pairs);

    // 创建卡片对
    const cardEmojis = [...selectedEmojis, ...selectedEmojis];
    gameState.cards = shuffle(cardEmojis);

    // 切换界面
    document.getElementById('difficultyScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';

    updateUI();
    renderGrid();
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function renderGrid() {
    const grid = document.getElementById('grid');
    const config = DIFFICULTY_CONFIG[gameState.difficulty];
    grid.className = `grid ${gameState.difficulty}`;
    grid.innerHTML = '';

    gameState.cards.forEach((emoji, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;
        card.dataset.emoji = emoji;

        card.innerHTML = `
            <div class="card-inner">
                <div class="card-face card-back"></div>
                <div class="card-face card-front">${emoji}</div>
            </div>
        `;

        card.addEventListener('click', () => flipCard(card));
        grid.appendChild(card);
    });
}

function flipCard(card) {
    if (gameState.locked) return;
    if (card.classList.contains('flipped')) return;
    if (card.classList.contains('matched')) return;
    if (gameState.flippedCards.length >= 2) return;

    // 翻牌
    card.classList.add('flipped');
    gameState.flippedCards.push(card);

    // 两张都翻了，检查匹配
    if (gameState.flippedCards.length === 2) {
        gameState.locked = true;
        gameState.attempts++;

        const [card1, card2] = gameState.flippedCards;

        if (card1.dataset.emoji === card2.dataset.emoji) {
            // 匹配成功
            setTimeout(() => {
                card1.classList.add('matched');
                card2.classList.add('matched');
                gameState.matchedPairs++;
                gameState.flippedCards = [];
                gameState.locked = false;

                updateUI();

                // 检查是否完成
                if (gameState.matchedPairs === gameState.totalPairs) {
                    setTimeout(showComplete, 600);
                }
            }, 300);
        } else {
            // 匹配失败
            setTimeout(() => {
                card1.classList.add('mismatch');
                card2.classList.add('mismatch');

                setTimeout(() => {
                    card1.classList.remove('flipped', 'mismatch');
                    card2.classList.remove('flipped', 'mismatch');
                    gameState.flippedCards = [];
                    gameState.locked = false;
                }, 800);
            }, 600);
        }

        updateUI();
    }
}

function updateUI() {
    document.getElementById('score').textContent = gameState.matchedPairs;
    document.getElementById('pairs').textContent = gameState.matchedPairs;
    document.getElementById('totalPairs').textContent = gameState.totalPairs;
}

function showComplete() {
    const modal = document.getElementById('modal');
    modal.classList.add('show');

    // 计算星级
    const perfect = gameState.totalPairs;
    const good = gameState.totalPairs * 1.5;
    let stars;
    if (gameState.attempts <= perfect) {
        stars = '⭐⭐⭐';
    } else if (gameState.attempts <= good) {
        stars = '⭐⭐';
    } else {
        stars = '⭐';
    }

    document.getElementById('stars').textContent = stars;
    document.getElementById('modalStats').innerHTML = `
        用了 ${gameState.attempts} 次找到 ${gameState.totalPairs} 对
    `;
}

function restartGame() {
    document.getElementById('modal').classList.remove('show');
    startGame(gameState.difficulty);
}

function backToMenu() {
    document.getElementById('modal').classList.remove('show');
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('difficultyScreen').style.display = 'flex';
}

// iOS首次交互解锁音频
document.addEventListener('touchstart', function firstTouch() {
    // 预留，未来加音效
}, { once: true });
</script>

</body>
</html>
